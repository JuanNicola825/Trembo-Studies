<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trembo Studies</title>

    <!-- Conecta el diseño -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- =========================
         PANTALLA DE IDIOMA
    ========================== -->
    <section id="languageScreen" class="language-screen">

        <div class="language-box">

            <h1 id="languageTitle">Trembo Studies</h1>

            <p>Elegí tu idioma / Choose your language</p>

            <div class="language-buttons">
                <button onclick="selectLanguage('es')">
                    Español
                </button>

                <button onclick="selectLanguage('en')">
                    English
                </button>

                <button onclick="selectLanguage('he')">
                    עברית
                </button>
            </div>

        </div>

        <img
            src="buenas123.png"
            alt="Buenas"
            class="main-image"
        >

    </section>


    <!-- =========================
         APLICACIÓN
    ========================== -->
    <section id="app" class="app hidden">

        <!-- CONTADOR DE TREMBOLONA -->
        <div class="trembo-counter">
            <span id="tremboAmount">0</span>
            <span id="tremboText">Trembolona</span>
        </div>


        <!-- MENÚ LATERAL -->
        <aside class="sidebar">

            <h2>Trembo Studies</h2>

            <button onclick="showPage('calendar')">
                <span id="menuCalendar">Calendario</span>
            </button>

            <button onclick="showPage('results')">
                <span id="menuResults">
                    Resultados de las pruebas
                </span>
            </button>

            <button onclick="showPage('dianabol')">
                Dianabol
            </button>

        </aside>


        <!-- CONTENIDO PRINCIPAL -->
        <main class="main-content">


            <!-- =========================
                 CALENDARIO
            ========================== -->
            <section id="calendarPage" class="page">

                <h1 id="calendarTitle">
                    Calendario
                </h1>

                <div class="calendar-header">

                    <button onclick="changeMonth(-1)">
                        ←
                    </button>

                    <h2 id="monthTitle"></h2>

                    <button onclick="changeMonth(1)">
                        →
                    </button>

                </div>


                <div id="calendar" class="calendar"></div>


                <!-- FORMULARIO -->
                <div
                    id="testForm"
                    class="test-form hidden"
                >

                    <h2 id="selectedDateTitle">
                        Agregar prueba
                    </h2>

                    <label>
                        Materia
                    </label>

                    <input
                        type="text"
                        id="subjectInput"
                        placeholder="Ej: Matemática"
                    >


                    <label>
                        Notas adicionales
                    </label>

                    <textarea
                        id="notesInput"
                        placeholder="Información sobre la prueba..."
                    ></textarea>


                    <button onclick="addTest()">
                        <span id="addTestText">
                            Agregar prueba
                        </span>
                    </button>

                </div>

            </section>



            <!-- =========================
                 RESULTADOS
            ========================== -->
            <section
                id="resultsPage"
                class="page hidden"
            >

                <h1 id="resultsTitle">
                    Resultados de las pruebas
                </h1>


                <!-- ESTADÍSTICAS -->
                <div class="stats">

                    <div class="stat-card">

                        <h3 id="averageText">
                            Promedio /10
                        </h3>

                        <strong id="average">
                            -
                        </strong>

                    </div>


                    <div class="stat-card">

                        <h3>
                            Porcentaje
                        </h3>

                        <strong id="percentage">
                            -
                        </strong>

                    </div>


                    <div class="stat-card">

                        <h3>
                            Puntos
                        </h3>

                        <strong id="totalPoints">
                            -
                        </strong>

                    </div>

                </div>


                <!-- LISTA DE PRUEBAS -->
                <div id="resultsList"></div>

            </section>



            <!-- =========================
                 DIANABOL
            ========================== -->
            <section
                id="dianabolPage"
                class="page hidden"
            >

                <h1>Dianabol</h1>

                <p>
                    Accesos rápidos:
                </p>


                <div class="links">

                    <a
                        href="https://chatgpt.com"
                        target="_blank"
                    >
                        ChatGPT
                    </a>


                    <a
                        href="https://gemini.google.com"
                        target="_blank"
                    >
                        Gemini
                    </a>


                    <a
                        href="https://claude.ai"
                        target="_blank"
                    >
                        Claude
                    </a>


                    <a
                        href="https://www.google.com"
                        target="_blank"
                    >
                        Google
                    </a>


                    <a
                        href="https://classroom.google.com"
                        target="_blank"
                    >
                        Google Classroom
                    </a>


                    <a
                        href="https://docs.google.com"
                        target="_blank"
                    >
                        Google Docs
                    </a>


                    <a
                        href="https://mail.google.com"
                        target="_blank"
                    >
                        Gmail
                    </a>


                    <a
                        href="https://parazero.com"
                        target="_blank"
                    >
                        Parazero Technologies
                    </a>

                </div>

            </section>

        </main>

    </section>


    <!-- Conecta la programación -->
    <script src="script.js"></script>

</body>
</html>
